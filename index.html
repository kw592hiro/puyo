<!DOCTYPE HTML>
<html>

<head>
    <title>ぷよぷよ風ゲーム </title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/web-console-log"></script>
    <script src="src/config.js"></script>
    <script src="src/stage.js"></script>
    <script src="src/game.js"></script>
    <script src="src/image.js"></script>
    <script src="src/player.js"></script>
    <script src="src/score.js"></script>

    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="layout">
        <div id="leftControls">
            <div id="lrBtn">
                <button class="btn" onclick="moveLeft()">←</button>
                <button class="btn" onclick="moveRight()">→</button>
            </div>
            <button class="btn wide" onclick="softDrop()">↓</button>
        </div>

        <div id="gameStage">
            <div id="subStage">
                <div id="stage"></div>
                <div id="score"></div>
            </div>
            <div id="next"></div>
        </div>

        <div id="rightControls">
            <button class="btn" onclick="rotateLeft()">⟲</button>
            <button class="btn" onclick="rotateRight()">⟳</button>
        </div>
    </div>

    <div style="display:none">
        <img src="img/puyo_1.png" id="puyo_1">
        <img src="img/puyo_2.png" id="puyo_2">
        <img src="img/puyo_3.png" id="puyo_3">
        <img src="img/puyo_4.png" id="puyo_4">
        <img src="img/puyo_5.png" id="puyo_5">
        <img src="img/zenkeshi.png" id="zenkeshi">
        <img src="img/0.png" id="font_0">
        <img src="img/1.png" id="font_1">
        <img src="img/2.png" id="font_2">
        <img src="img/3.png" id="font_3">
        <img src="img/4.png" id="font_4">
        <img src="img/5.png" id="font_5">
        <img src="img/6.png" id="font_6">
        <img src="img/7.png" id="font_7">
        <img src="img/8.png" id="font_8">
        <img src="img/9.png" id="font_9">
        <img src="img/batankyu.png" id="batankyu">
    </div>
</body>

</html>
